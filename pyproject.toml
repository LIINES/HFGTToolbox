[project]
name = "hfgt-toolbox"
version = "4.7.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "geopandas>=1.1.2",
    "loguru>=0.7.3",
    "numpy==2.2.6",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "regex>=2026.1.15",
    "scipy==1.15.3",
    "sparse==0.16.0",
    "typer>=0.21.1",
    "typing-extensions==4.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.3.2",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
toolbox = "hfgt_toolbox.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src_python/hfgt_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
]
markers = [
    "output_ext: specify the file extension for dynamic output paths"
]

[tool.pytest_env]
ENABLE_ARCHIVING = "False"
FAIL_JULIA_TESTS = "False"
ENABLE_FILE_LOGGING = "False"


